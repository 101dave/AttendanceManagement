<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
  <script src="/supabase.js" type="modoule" defer></script>
</head>
<body data-page="student">
  <header class="topbar">
    <a class="brand" href="/">Attendance Portal</a>
    <div class="actions">
      <button class="button secondary" type="button" data-theme-toggle>Toggle theme</button>
      <button class="button secondary hidden" type="button" data-logout>Sign out</button>
    </div>
  </header>

  <main class="container">
    <section class="card login-panel">
      <h1>Student login</h1>
      <form data-login-form data-role="student">
        <label>Username <input name="username" autocomplete="username" required maxlength="80"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Sign in</button>
        <p class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="dashboard hidden" data-dashboard>
      <h1>Welcome, <span data-user-name></span></h1>
      <p>Attendance: <strong data-attendance-percent>—</strong> · Status: <strong data-pass-status>—</strong></p>
      <section class="card">
        <h2>Attendance records</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Subject</th><th>Activity</th><th>Status</th></tr></thead>
            <tbody data-attendance-body></tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <h2>Activity scores</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Subject</th><th>Activity</th><th>Score</th></tr></thead>
            <tbody data-scores-body></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
